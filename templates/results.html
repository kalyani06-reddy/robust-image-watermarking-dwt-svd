<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">DWT-SVD</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/embed">Embed</a></li>
                    <li class="nav-item"><a class="nav-link" href="/extract">Extract</a></li>
                    <li class="nav-item"><a class="nav-link" href="/robustness">Robustness</a></li>
                    <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-4">
            <div class="col-md-6"><canvas id="ncChart" height="120"></canvas></div>
            <div class="col-md-6"><canvas id="berChart" height="120"></canvas></div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body">
                <h3>Experiment Summary</h3>
                <div id="results-table"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const resultData = {{ result_data|tojson|safe }};
        window.resultData = resultData;
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
