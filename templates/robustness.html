<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robustness Testing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">DWT-SVD</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/embed">Embed</a></li>
                    <li class="nav-item"><a class="nav-link" href="/extract">Extract</a></li>
                    <li class="nav-item"><a class="nav-link" href="/robustness">Robustness</a></li>
                    <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-4">Robustness Testing</h2>
                <form id="robustness-form" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Watermarked image</label>
                            <input class="form-control" type="file" name="watermarked" accept=".png,.jpg,.jpeg,.bmp" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Original cover image</label>
                            <input class="form-control" type="file" name="cover" accept=".png,.jpg,.jpeg,.bmp" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Original watermark</label>
                            <input class="form-control" type="file" name="watermark" accept=".png,.jpg,.jpeg,.bmp" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Wavelet</label>
                            <select class="form-select" name="wavelet">
                                <option value="haar" selected>Haar</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Level</label>
                            <input class="form-control" type="number" name="level" value="1" min="1" max="3">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Subband</label>
                            <select class="form-select" name="subband">
                                <option value="LL" selected>LL</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Strength</label>
                            <input class="form-control" type="number" name="alpha" step="0.01" min="0.01" max="0.3" value="0.05">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Watermark type</label>
                            <select class="form-select" name="watermark_type">
                                <option value="grayscale" selected>Grayscale</option>
                                <option value="binary">Binary</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <h5 class="mt-2">Attacks and strengths</h5>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="jpeg" checked>
                                        <label class="form-check-label">JPEG qualities</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="jpeg" value="90,70,40" aria-label="JPEG quality levels">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="gaussian_noise" checked>
                                        <label class="form-check-label">Gaussian noise variance</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="gaussian_noise" type="number" min="0" max="10000" step="1" value="25">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="salt_pepper" checked>
                                        <label class="form-check-label">Salt-and-pepper density</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="salt_pepper" type="number" min="0" max="1" step="0.01" value="0.01">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="gaussian_blur" checked>
                                        <label class="form-check-label">Gaussian blur kernel size</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="gaussian_blur" type="number" min="1" max="99" step="2" value="5">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="resize" checked>
                                        <label class="form-check-label">Resize scale</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="resize" type="number" min="0.01" max="4" step="0.05" value="0.75">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="brightness" checked>
                                        <label class="form-check-label">Brightness delta</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="brightness" type="number" min="-255" max="255" step="1" value="20">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="contrast" checked>
                                        <label class="form-check-label">Contrast factor</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="contrast" type="number" min="0" max="4" step="0.1" value="1.2">
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input attack-choice" type="checkbox" value="crop" checked>
                                        <label class="form-check-label">Center crop ratio</label>
                                    </div>
                                    <input class="form-control attack-strength" data-attack="crop" type="number" min="0.01" max="1" step="0.05" value="0.8">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Optional key</label>
                            <input class="form-control" type="text" name="key" placeholder="same as embedding">
                        </div>
                    </div>
                    <button class="btn btn-primary mt-4" type="submit">Run Robustness Analysis</button>
                </form>
                <div id="robustness-status" class="mt-4"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
